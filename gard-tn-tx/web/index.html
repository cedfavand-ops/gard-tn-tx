<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gard – prévision Tn / Tx du lendemain</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#map{height:100%;margin:0}
  body{font:13px/1.4 system-ui,sans-serif}
  .panel{position:absolute;z-index:1000;top:10px;left:10px;width:270px;max-height:calc(100% - 20px);overflow:auto;
         background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.3);color:#222}
  .panel h1{font-size:15px;margin:0 0 10px}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{flex:1;padding:7px 0;border:1px solid #1a5bbf;border-radius:6px;background:#fff;color:#1a5bbf;font-weight:600;cursor:pointer}
  .tabs button.on{background:#1a5bbf;color:#fff}
  #bar{height:10px;border-radius:5px;margin-top:4px}
  .lab{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:8px}
  .small{font-size:12px;color:#444;margin-top:8px}
  .warn{color:#b3261e;font-weight:600}
  input[type=range]{width:100%}
  @media (max-width:600px){.panel{width:auto;right:10px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Gard – prévision du lendemain</h1>
  <div class="tabs"><button id="b-tn" class="on">Tn (nuit)</button><button id="b-tx">Tx (jour)</button></div>
  <div id="bar"></div>
  <div class="lab"><span id="lo"></span><span id="hi"></span></div>
  <label>Opacité des couleurs<input id="op" type="range" min="0" max="1" step="0.05" value="0.8"></label>
  <div class="small" id="info">Chargement…</div>
  <div class="small">Cliquez sur la carte pour lire la valeur.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', {zoomSnap: 0.25}).setView([43.95, 4.05], 9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  {attribution: '© OpenStreetMap, © CARTO', maxZoom: 16}).addTo(map);
map.createPane('labels'); map.getPane('labels').style.zIndex = 450; map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {pane: 'labels', maxZoom: 16}).addTo(map);

let meta, mode = 'tn', overlay = null, vals = null;
const $ = id => document.getElementById(id);
const fmt = iso => new Date(iso).toLocaleString('fr-FR', {weekday: 'short', day: '2-digit', month: '2-digit',
  hour: '2-digit', minute: '2-digit', timeZone: 'UTC'}) + ' UTC';
const merc = la => Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360));

function setMode(m) {
  mode = m;
  $('b-tn').classList.toggle('on', m === 'tn'); $('b-tx').classList.toggle('on', m === 'tx');
  const [w, s, e, n] = meta.bounds, sc = meta[m];
  if (overlay) map.removeLayer(overlay);
  overlay = L.imageOverlay(m + '.png?' + meta.generated, [[s, w], [n, e]], {opacity: +$('op').value}).addTo(map);
  $('lo').textContent = sc.vmin + ' °C'; $('hi').textContent = sc.vmax + ' °C';
  vals = null;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(img, 0, 0);
    vals = {w: img.width, h: img.height, d: g.getImageData(0, 0, img.width, img.height).data};
  };
  img.src = m + '_val.png?' + meta.generated;
  info();
}

function info() {
  const t = meta[mode];
  const lbl = mode === 'tn' ? 'Tn' : 'Tx';
  let h = `Run ICON-CH1 de ${fmt(meta.run)}<br>${lbl} : ${fmt(t.start)} → ${fmt(t.end)}`;
  if (t.truncated) h += ' <span class="warn">(fenêtre tronquée)</span>';
  if (mode === 'tn') {
    h += `<br>Indice d’inversion : <b>${meta.inversion}</b> (0 = aucune, 1 = nuit calme et claire)`;
    if (meta.wind !== null) h += `<br>Vent nocturne moyen ${meta.wind} m/s, nébulosité ${meta.cloud} %`;
    h += `<br>Structure fine d’après une thermographie ECOSTRESS du ${meta.ecostress}.`;
  } else {
    h += '<br>Valeurs du modèle corrigées du relief.';
  }
  h += `<br><br>Prévision expérimentale, maille ${meta.res} m.<br>Données : MeteoSuisse, ICON-CH1-EPS (OGD) ; ECOSTRESS (NASA/LP DAAC) ; Copernicus DEM.`;
  if (meta.demo) h = '<span class="warn">DÉMONSTRATION : données synthétiques</span><br>' + h;
  $('info').innerHTML = h;
}

map.on('click', e => {
  if (!vals) return;
  const [w, s, east, n] = meta.bounds;
  const x = Math.floor((e.latlng.lng - w) / (east - w) * vals.w);
  const y = Math.floor((merc(n) - merc(e.latlng.lat)) / (merc(n) - merc(s)) * vals.h);
  let txt = 'Hors zone';
  if (x >= 0 && y >= 0 && x < vals.w && y < vals.h) {
    const i = (y * vals.w + x) * 4, q = vals.d[i] * 256 + vals.d[i + 1];
    if (q > 0) txt = `${mode === 'tn' ? 'Tn' : 'Tx'} ≈ <b>${(q / 100 - 50).toFixed(1)} °C</b>`;
  }
  L.popup().setLatLng(e.latlng).setContent(txt).openOn(map);
});

$('op').oninput = () => overlay && overlay.setOpacity(+$('op').value);
$('b-tn').onclick = () => meta && setMode('tn');
$('b-tx').onclick = () => meta && setMode('tx');

fetch('meta.json?' + Date.now()).then(r => r.json()).then(m => {
  meta = m;
  $('bar').style.background = 'linear-gradient(to right,' +
    m.stops.map(s => `rgb(${s[1].join(',')}) ${s[0] * 100}%`).join(',') + ')';
  setMode('tn');
}).catch(() => $('info').textContent = 'Prévision indisponible.');
</script>
</body>
</html>
