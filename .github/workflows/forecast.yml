name: Prévision Tn/Tx Gard

on:
  schedule:
    - cron: "20 14 * * *"      # 14:20 UTC chaque jour : le run ICON-CH1 de 12 UTC est normalement disponible
  workflow_dispatch:
    inputs:
      res:
        description: "Résolution (150 ou 70 m)"
        default: "150"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bibliothèque ecCodes (lecture GRIB)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - run: pip install -r requirements.txt
      - name: Cache des données statiques (MNT, masque, ECOSTRESS)
        uses: actions/cache@v4
        with:
          path: |
            data/static_*.npz
            data/sx_*.npz
            data/gard_contour.json
          key: static-${{ hashFiles('data/ecostress/*.tif', 'src/static.py', 'src/wind.py') }}-${{ inputs.res || '150' }}
      - name: Observations des stations Météo-France du Gard
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u -m src.observe
      - name: Calcul des cartes
        env:
          TQDM_DISABLE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -u -m src.run --res ${{ inputs.res || '150' }} --out site 2>&1 \
            | grep --line-buffered -v -E '^-{20,}|definitions\.edzw|Please check environment|^\s*$|Earthkit-data caching|AWSAccessKeyId'
          code=${PIPESTATUS[0]}
          exit $code
      - name: Vérification prévisions / stations
        continue-on-error: true
        run: python -u -m src.verify
      - name: Calibration (proposition hebdomadaire ; appliquée seulement si AUTO_CALIBRATION = True)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u -m src.calibration
          fi
      - name: Sauvegarder l'historique dans le dépôt
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/history data/stations_gard.csv
          if ! git diff --cached --quiet; then
            git commit -m "Historique prévisions/observations [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Envoi refusé, nouvel essai ($i/3)"; sleep 5
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
